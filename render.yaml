# Render Blueprint: deploys the site as a static site.
# On Render: New → Blueprint → pick this repo (or New → Static Site with the same settings).
services:
  - type: web
    name: shyastha
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/video/*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # single-page app: every page address is served by index.html
      - type: rewrite
        source: /*
        destination: /index.html
