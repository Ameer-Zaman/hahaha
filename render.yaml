# Render Blueprint: the Rameirah Empire API + admin backend (server/).
# On Render: New → Blueprint → pick this repo. Render asks for the values marked sync: false.
# The website is a separate static site (Render or Netlify): see README step 4 to forward /api to this service.
services:
  - type: web
    name: shyastha-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # MongoDB Atlas connection string (Atlas → Connect → Drivers), including the db name.
      - key: MONGODB_URI
        sync: false
      # Session signing secret — Render generates a long random value.
      - key: JWT_SECRET
        generateValue: true
      # The website's address(es), comma-separated, no trailing slash — e.g.
      # https://shyastha.pages.dev,https://shyastha.com. Set in the Render dashboard.
      - key: CLIENT_ORIGIN
        sync: false
      # Website proxy (Cloudflare Pages Function or static-site rewrite) → Render proxy → app.
      - key: TRUST_PROXY
        value: "2"
      # Cloudinary (optional): cloudinary://<api_key>:<api_secret>@<cloud_name>. Uploads then go
      # to Cloudinary and are delivered from its CDN; leave it out to store them in the database.
      - key: CLOUDINARY_URL
        sync: false
      # Website chat (optional): AI assistant + Discord hand-off. See README "Website chat".
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CHAT_CHANNEL_ID
        sync: false
      - key: DISCORD_STAFF_ROLE_ID
        sync: false
      # First Super Admin. Only used while the database has no accounts; delete afterwards.
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
